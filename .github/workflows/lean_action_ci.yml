name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Check regression tests and foundational axiom guards
        shell: bash
        run: |
          for file in Tests/*.lean; do
            lake env lean "$file"
          done
